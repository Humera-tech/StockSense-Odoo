services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: stocksense
      POSTGRES_DB: stocksense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
